name: Frozen LeFlow refinement checks
on:
  push:
    branches: [main]
    paths: ['leflow_refinement/**', 'tests/*refinement*.py', 'tests/test_noise_cem*.py', '.github/workflows/refinement.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: refinement-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  numerical:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            leflow_refinement
            crossbench
            flow_jepa
            tests
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install numpy==2.2.6 h5py omegaconf pytest==9.0.2
      - shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s tests -p 'test_leflow_refinement*.py' -v 2>&1 | tee refinement-tests.log
      - name: Noise CEM numerical and adapter checks
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q tests/test_noise_cem*.py --junitxml=noise-cem-tests.xml 2>&1 | tee noise-cem-tests.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: refinement-numerical-checks
          path: |
            refinement-tests.log
            noise-cem-tests.log
            noise-cem-tests.xml
          retention-days: 14
  released:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      SDL_VIDEODRIVER: dummy
      MUJOCO_GL: osmesa
      PYOPENGL_PLATFORM: osmesa
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            leflow_refinement
            crossbench
            btm_jepa
            flow_jepa
            config
            tests
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update -qq && sudo apt-get install -y libosmesa6 libgl1 libegl1
      - run: pip install torch==2.8.0 torchvision==0.23.0 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install 'stable-worldmodel @ git+https://github.com/galilai-group/stable-worldmodel.git@06b1f4c24ccb237a9b2d6bb65bf010a6a5b41e83' gymnasium==1.2.0 numpy==2.2.6 pygame==2.6.1 pymunk==7.1.0 shapely==2.1.2 ogbench==1.2.0 mujoco==3.3.7 dm-control==1.0.34 omegaconf hdf5plugin opencv-python-headless==4.12.0.88 transformers==4.57.6 huggingface-hub==0.36.0 einops==0.8.1
      - run: python tests/refinement_released_check.py
      - if: always()
        run: |
          mkdir -p refinement-checks
          git rev-parse HEAD > refinement-checks/tested_commit.txt
          zip -r refinement-checks/tested-source.zip leflow_refinement tests/test_leflow_refinement*.py tests/test_noise_cem*.py tests/refinement_released_check.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: refinement-released-checks
          path: refinement-checks
          retention-days: 14
