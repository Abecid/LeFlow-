name: Cross-benchmark controller checks
on:
  push:
    branches: [main]
    paths: ['crossbench/**', 'tests/test_crossbench*.py', 'tests/crossbench*.py', 'scripts/operations/crossbench*', '.github/workflows/crossbench.yml']
  workflow_dispatch:
concurrency:
  group: crossbench-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*.py
            /*.txt
            /*.md
            /crossbench/
            /flow_jepa/
            /btm_jepa/
            /tests/
            /config/
            /scripts/
            /docs/results-ledger.json
            /docs/CROSSBENCH_BASELINES.md
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install numpy h5py omegaconf hdf5plugin pillow
      - run: python -m compileall -q crossbench
      - name: Require and execute the cross-benchmark tests
        run: |
          python - <<'PY'
          import unittest
          suite=unittest.defaultTestLoader.discover('tests',pattern='test_crossbench*.py')
          if suite.countTestCases()==0: raise RuntimeError('No tests discovered')
          result=unittest.TextTestRunner(verbosity=2).run(suite)
          if not result.wasSuccessful(): raise SystemExit(1)
          PY
      - name: Two-rank training and gradient synchronization
        run: python -m torch.distributed.run --standalone --nproc_per_node=2 tests/crossbench_ddp_check.py
      - name: Export tracked runtime source
        if: always()
        run: |
          python - <<'PY'
          import subprocess,zipfile
          from pathlib import Path
          with zipfile.ZipFile('runtime-source.zip','w',zipfile.ZIP_DEFLATED) as z:
              for f in subprocess.check_output(['git','ls-files'],text=True).splitlines():
                  p=Path(f)
                  if not p.is_file() or 'docs/reports/' in f or '.git/' in f: continue
                  if p.suffix in {'.py','.json','.yaml','.yml','.toml','.sh','.md','.txt'} and p.stat().st_size<400000:
                      z.write(p,f)
              z.writestr('SOURCE_COMMIT',subprocess.check_output(['git','rev-parse','HEAD'],text=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-source
          path: runtime-source.zip
          retention-days: 7
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      SDL_VIDEODRIVER: dummy
      MUJOCO_GL: osmesa
      PYOPENGL_PLATFORM: osmesa
      CROSSBENCH_NATIVE_TEST: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*.py
            /*.txt
            /*.md
            /crossbench/
            /flow_jepa/
            /btm_jepa/
            /tests/
            /config/
            /scripts/
            /docs/results-ledger.json
            /docs/CROSSBENCH_BASELINES.md
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update -qq && sudo apt-get install -y libosmesa6 libgl1 libegl1
      - run: pip install torch==2.8.0 torchvision==0.23.0 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install 'stable-worldmodel @ git+https://github.com/galilai-group/stable-worldmodel.git@06b1f4c24ccb237a9b2d6bb65bf010a6a5b41e83' gymnasium==1.2.0 numpy==2.2.6 pygame==2.6.1 pymunk==7.1.0 shapely==2.1.2 ogbench==1.2.0 mujoco==3.3.7 dm-control==1.0.34 omegaconf hdf5plugin opencv-python-headless==4.12.0.88
      - run: python -m unittest discover -s tests -p 'test_crossbench_native.py' -v
      - run: pip install transformers==4.57.6 huggingface-hub==0.36.0 einops==0.8.1
      - name: Released LeWM encoder and differentiable dynamics interfaces
        run: python tests/crossbench_released_model_check.py
